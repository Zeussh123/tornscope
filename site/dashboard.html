  .plink { background:none; border:0; color: var(--accent); cursor:pointer; padding:0 4px; font-size:12.5px; text-decoration:underline; }
  .ttool { padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; } .ttool input[type=search] { width:190px; }
  .rhead { display:flex; justify-content:space-between; align-items:center; margin-top:2px; } .rcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .rcard { text-align:left; background: var(--panel); color: var(--text); border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; } .rcard:hover, .rcard.best { border-color: var(--accent); } .rbig { font-size:22px; font-weight:700; margin:2px 0; }
  .bad-text { color: var(--bad); } .tmain .tablewrap td, .tmain .tablewrap th { padding-left:10px; padding-right:10px; } tr.detrow > td { padding:0; background: var(--bg2); } .idet { padding:14px; display:flex; flex-direction:column; gap:12px; }

  .cwrap { padding:12px 14px; } .ctitle { letter-spacing:.04em; margin-bottom:6px; } .tchartwrap { position:relative; } svg.tchart { width:100%; height:auto; display:block; } svg.tchart text { fill: var(--muted); font-size:11px; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .side { background: var(--bg2); border-right: 1px solid var(--line); padding: 20px 14px;
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; font-size: 16px; }
  .brand .logo { width: 36px; height: 36px; display: grid; place-items: center; color: var(--accent); }
  .brand .logo svg, .ico-svg svg { width: 100%; height: 100%; display: block; }
  .brand .name { font-size: 18px; letter-spacing: -.01em; }

  .prem-chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px 4px 8px; border-radius: 999px; font-weight: 600;

  .hero.on { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 10%, var(--panel)), var(--panel)); }
  .countdown { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--gold); }

    color: var(--gold-ink); font-weight: 700; text-decoration: none; border: 0; cursor: pointer; font-size: 15px; }
  .btn-gold:hover { filter: brightness(1.06); text-decoration: none; }

  /* ---------- components ---------- */
  .grid { display: grid; gap: 16px; }
  .cols-4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .cols-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

  input[type=checkbox] { width: 18px; height: 18px; padding: 0; accent-color: var(--accent); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stack { display: grid; gap: 10px; max-width: 440px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); } .badge.info { color: var(--info); } .badge.acc { color: var(--accent2); }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--panel2); white-space: nowrap; user-select: none; }
  th.sortable { cursor: pointer; } th.sortable:hover { color: var(--text); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--panel2); }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); margin-bottom: 4px; }

  /* ================= Admin: owner key (Full access) + log viewer ================= */
  async function ownerKeyPanel(box) {
    await loadPay();
    const r = await api('GET', '/admin/owner-key');
    clear(box);
    box.appendChild(h('h3', { text: 'Owner key (Torn log access)' }));
    const d = r.data || {};
    const card = h('div', { class: 'card' }); box.appendChild(card);
    card.appendChild(h('p', { class: 'muted small', text: 'Used only to read YOUR Torn log (to recognise Xanax sent with the message ‘' + kw() + '’ and credit Premium). Torn requires a Full Access key for the log. It is stored encrypted, never shown again, never logged. Delete it here, and revoke it in Torn, if you stop using this.' }));
    if (r.ok && d.available === false) card.appendChild(h('div', { class: 'note' }, 'Key storage is not configured (add the KEY_ENCRYPTION_SECRET secret).'));
    const k = d.key;
    if (k) {
      card.appendChild(h('div', { class: 'switch' }, h('span', { class: 'muted', text: 'Status' }), h('span', { class: 'badge ' + (k.status === 'valid' ? 'ok' : 'bad'), text: k.status === 'valid' ? 'Valid' : k.status })));
      card.appendChild(h('div', { class: 'switch' }, h('span', { class: 'muted', text: 'Owner / access' }), h('b', { text: (k.tornName || '—') + ' [' + k.tornId + '] · ' + (k.accessType || 'unknown') })));
      card.appendChild(h('div', { class: 'switch' }, h('span', { class: 'muted', text: 'Last check' }), h('b', { text: k.lastCheckAt ? ago(k.lastCheckAt) : '—' })));
      const dt = d.detector;
      card.appendChild(h('h3', { style: 'margin-top:14px', text: 'Automatic Xanax detection' }));
      card.appendChild(h('p', { class: 'muted small', text: 'Every ~2 minutes the server reads your log. A Xanax received with the message ‘' + kw() + '’ (any capitalisation or spacing) from a player who has an account here credits 7 days per Xanax (14 for players in your faction or company). Xanax without that message (yours) are ignored. Only entries newer than the first check are considered.' }));
      if (!dt) card.appendChild(h('div', { class: 'note' }, 'No check yet: it starts with the next cron run (up to a few minutes).'));
      else {
        card.appendChild(h('div', { class: 'switch' }, h('span', { class: 'muted', text: 'Last check' }), h('b', { text: dt.lastRunAt ? ago(dt.lastRunAt) : '—' })));
        card.appendChild(h('div', { class: 'switch' }, h('span', { class: 'muted', text: 'Last successful read' }), h('b', { text: dt.lastOkAt ? ago(dt.lastOkAt) : '—' })));
        card.appendChild(h('div', { class: 'switch' }, h('span', { class: 'muted', text: 'Watching entries since' }), h('b', { text: dFmt(dt.sinceTs) })));
        card.appendChild(h('div', { class: 'switch' }, h('span', { class: 'muted', text: 'Credited / to review' }), h('b', { text: (dt.credited || 0) + ' / ' + (dt.pending || 0) })));
        if (dt.lastError) card.appendChild(h('div', { class: 'note' }, 'Last error: ' + dt.lastError));
      }
    }
    const input = h('input', { type: 'password', autocomplete: 'off', spellcheck: 'false', placeholder: 'Paste your Full Access key', maxlength: 40, class: 'mono', style: 'width:100%' });
    const msg = h('p', { class: 'muted small', role: 'status' });
    if (d.available !== false) card.appendChild(h('form', { class: 'stack', onsubmit: async (ev) => {
      ev.preventDefault(); const v = input.value.trim(); input.value = ''; if (!v) { msg.textContent = 'Paste your key first.'; return; }
      msg.textContent = 'Checking with Torn…'; const res = await api('PUT', '/admin/owner-key', { key: v });
      if (res.ok) { await ownerKeyPanel(box); const m = $('#ownerMsg'); if (m) m.textContent = res.data.message; } else msg.textContent = res.data.message || 'Could not save the key.';
    } }, input, h('div', { class: 'row' }, h('button', { type: 'submit' }, k ? 'Replace key' : 'Verify and save key'),
      k ? h('button', { type: 'button', class: 'danger', onclick: async () => { if (!confirm('Delete the owner key from the server?')) return; const res = await api('DELETE', '/admin/owner-key'); await ownerKeyPanel(box); toast(res.data.message || 'Deleted.'); } }, 'Delete key') : null)));
    card.appendChild(msg); card.appendChild(h('p', { id: 'ownerMsg', class: 'muted small', role: 'status' }));
    if (k) {
      const filter = h('input', { type: 'text', value: 'receive', maxlength: 40, style: 'width:160px', 'aria-label': 'Filter text' });
      const out = h('pre', { class: 'mono small', style: 'white-space:pre-wrap;max-height:360px;overflow:auto;margin:8px 0 0', text: '' });
      const lmsg = h('p', { class: 'muted small', role: 'status' });
      card.appendChild(h('h3', { style: 'margin-top:16px', text: 'Log viewer (diagnostic)' }));
      card.appendChild(h('p', { class: 'muted small', text: 'Shows the raw log entries of your own account that contain the filter text, to check what Torn returns (sender, item, quantity, message). Up to 15 entries, newest first. The default filter “receive” targets “Item receive” entries; if nothing matches, try “xanax” or leave it empty (every type). Torn may identify items by number rather than by name.' }));
      card.appendChild(h('div', { class: 'row' }, filter,
        h('button', { onclick: async () => {
          lmsg.textContent = 'Reading the log…'; out.textContent = '';
          const res = await api('GET', '/admin/owner-log?filter=' + encodeURIComponent(filter.value.trim()));
          if (!res.ok) { lmsg.textContent = res.data.message || 'Failed.'; return; }
          lmsg.textContent = res.data.fetched + ' entries read, ' + res.data.matched + ' match' + (res.data.matched > 15 ? ' (15 shown)' : '') + '.';
          out.textContent = JSON.stringify(res.data.entries, null, 2);
        } }, 'Read my log'),
        h('button', { class: 'ghost', onclick: async () => { try { await navigator.clipboard.writeText(out.textContent); toast('Copied.'); } catch (e) { toast('Select the text and copy it manually.'); } } }, 'Copy')));
      card.appendChild(lmsg); card.appendChild(out);
    }
  }

  async function collectorPanel(box) {
    const r = await api('GET', '/admin/collector');
    clear(box);
    if (!r.ok) { box.appendChild(h('div', { class: 'note' }, 'Collector status unavailable.')); return; }
    const c = r.data, st = c.state, now = c.now;
    const age = st.lastRunAt ? now - st.lastRunAt : null;
    const paused = st.haltedUntil && st.haltedUntil > now;
    let badge;
    if (!c.keyConfigured) badge = ['bad', 'No Torn key'];
    else if (age === null) badge = ['warn', 'Never ran'];
    else if (paused) badge = ['warn', 'Paused'];
    else if (age > 180) badge = ['bad', 'Not running'];
    else badge = ['ok', 'Running'];
    const manual = h('button', { class: 'ghost sm', onclick: async (ev) => { ev.target.disabled = true; ev.target.textContent = 'Running…'; const x = await api('POST', '/admin/collector/run'); toast(x.ok ? 'Run finished: ' + x.data.summary.polled + ' checked, ' + x.data.summary.events + ' event(s).' : (x.data.message || 'Run failed.')); await collectorPanel(box); } }, 'Run now');
    box.appendChild(h('div', { class: 'head' }, h('div', {}, h('h2', { text: 'Automatic collector' }), h('p', { class: 'muted small', text: 'Checks every watched player on the Torn API once a minute, even when nobody is logged in and no script is open.' })), h('div', { class: 'row' }, h('span', { class: 'badge ' + badge[0], text: badge[1] }), manual)));
    if (!c.keyConfigured) box.appendChild(h('div', { class: 'note' }, 'No Torn API key is configured on the server (secret TORN_API_KEY or COLLECTOR_API_KEY).'));
    else if (age === null) box.appendChild(h('div', { class: 'note' }, 'The collector has never run. In Cloudflare: your Worker \u2192 Settings \u2192 Triggers \u2192 Cron Triggers \u2192 add the schedule * * * * * (every minute). A new trigger can take up to 15 minutes to start. You can press “Run now” to test immediately.'));
    else if (age > 180 && !paused) box.appendChild(h('div', { class: 'note' }, 'The last run was ' + ago(st.lastRunAt).replace(' ago', '') + ' ago. The cron trigger is missing or stopped (check Settings \u2192 Triggers \u2192 Cron Triggers in Cloudflare).'));
    if (paused) box.appendChild(h('div', { class: 'note' }, 'Paused until ' + dFmt(st.haltedUntil) + ' because Torn answered ' + (st.haltedReason || 'an error') + '. It resumes by itself.'));
    box.appendChild(h('div', { class: 'grid cols-4' },
      stat('Last run', age === null ? '—' : ago(st.lastRunAt), age === null ? '' : 'by ' + (st.lastRunTrigger === 'cron' ? 'the cron trigger' : 'a manual run')),
      stat('Last observation', c.lastObservationAt ? ago(c.lastObservationAt) : '—', 'last time Torn was asked about a player'),
      stat('Players watched', String(c.watchedTargets), c.subscriptions + ' subscriptions \u00b7 ' + c.dueNow + ' due now \u00b7 budget ' + c.budgetPerRun + '/run'),
      stat('Events recorded', String(c.events.total), c.events.last24h + ' in the last 24 h')));
    box.appendChild(h('div', { class: 'grid cols-4', style: 'margin-top:16px' },
      stat('Runs', String(st.runsTotal)), stat('Torn requests', String(st.pollsTotal)), stat('Errors', String(st.errorsTotal), st.lastError ? 'last: ' + st.lastError + (st.lastErrorAt ? ' (' + ago(st.lastErrorAt) + ')' : '') : 'none'), stat('Last success', st.lastSuccessAt ? ago(st.lastSuccessAt) : '—')));
    box.appendChild(h('h3', { style: 'margin-top:20px', text: 'Recent runs' }));
    box.appendChild(dataTable({ rows: c.runs, pageSize: 10, defaultSort: 'startedAt', empty: empty('No run yet'), cols: [
      { key: 'startedAt', label: 'Time', render: x => dFmt(x.startedAt) },
      { key: 'trigger', label: 'Trigger', render: x => h('span', { class: 'badge ' + (x.trigger === 'cron' ? 'ok' : ''), text: x.trigger }) },
      { key: 'polled', label: 'Checked', render: x => x.polled + ' / ' + x.due },
      { key: 'errors', label: 'Errors', render: x => h('span', { class: x.errors ? 'badge bad' : 'muted', text: String(x.errors) }) },
      { key: 'events', label: 'Events' }, { key: 'durationMs', label: 'Duration', render: x => x.durationMs + ' ms' },
      { key: 'note', label: 'Note', sort: false, render: x => h('span', { class: 'muted small', text: x.note || '' }) }] }).el);
    box.appendChild(h('h3', { style: 'margin-top:20px', text: 'Watched players' }));
    box.appendChild(dataTable({ rows: c.targets, pageSize: 10, defaultSort: 'lastPolledAt', defaultDir: 'asc', empty: empty('No watched player'), cols: [
      { key: 'name', label: 'Player', sortVal: x => (x.name || '').toLowerCase(), render: x => h('div', {}, h('b', { text: x.name || ('#' + x.tornId) }), h('div', { class: 'muted small mono', text: '#' + x.tornId })) },
      { key: 'state', label: 'Status', render: x => stateBadge(x.state) },
      { key: 'lastPolledAt', label: 'Last checked', sortVal: x => x.lastPolledAt || 0, render: x => x.lastPolledAt ? ago(x.lastPolledAt) : 'not yet' },
      { key: 'nextPollAt', label: 'Next check', sortVal: x => x.nextPollAt || 0, render: x => x.nextPollAt <= now ? 'due' : 'in ' + dur(Math.max(1, Math.round((x.nextPollAt - now) / 60))) },
      { key: 'polls', label: 'Checks' },
      { key: 'errorCount', label: 'Errors', render: x => x.errorCount ? h('span', { class: 'badge bad', title: x.lastError || '', text: x.errorCount + ' \u00b7 ' + (x.lastError || '') }) : h('span', { class: 'muted', text: '0' }) }] }).el);
  }

  /* ================= boot ================= */
  $('#logout').addEventListener('click', async () => { await api('POST', '/logout'); location.replace('/app'); });
  $('#refresh').addEventListener('click', async () => { await loadAll(false); go(true); toast('Data refreshed.'); });
  $('#themeBtn').addEventListener('click', () => { const cur = document.documentElement.getAttribute('data-theme'); setTheme(cur === 'dark' ? 'light' : 'dark'); });
  $('#burger').addEventListener('click', () => document.body.classList.toggle('menu'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('menu'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.body.classList.remove('menu'); });
  go();
  loadAll(false).then(go);
  const dataSig = () => JSON.stringify([S.targets, S.events && S.events.length, S.events && S.events[0], S.me && S.me.role]);
  setInterval(() => {
    if (document.hidden) return;
    const before = dataSig();
    loadAll(true).then(() => {
      if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      // Re-render only when something really changed (no flicker, no scroll jump otherwise).
      if (dataSig() !== before && ['overview', 'targets'].indexOf(route().page) >= 0 && !route().arg) go(true);
      updateBadge();
    });
  }, 60000);
})();
